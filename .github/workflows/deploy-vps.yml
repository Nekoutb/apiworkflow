name: Deploy to VPS (cmipaportal.com)

# -----------------------------------------------------------------------------
#  CI/CD: build the Next.js app on GitHub runners, then atomically deploy it
#  to the production VPS via SSH.
#
#  Triggers:
#    - Push to main (auto-deploy)
#    - Manual: Actions tab → "Deploy to VPS" → Run workflow
#
#  Required GitHub Secrets (set under Settings → Secrets and variables → Actions):
#
#  ── SSH transport ────────────────────────────────────────────────────────────
#    VPS_HOST            — server IP (e.g. 45.32.150.96)
#    VPS_USER            — Linux user on the server (you chose this manually)
#    VPS_PASSWORD        — SSH password for VPS_USER (you set with `passwd`)
#    VPS_PORT            — SSH port (OPTIONAL — defaults to 22)
#    VPS_KNOWN_HOSTS     — output of `ssh-keyscan -H <VPS_HOST>`
#                          (OPTIONAL but recommended)
#
#  ── App runtime env (sync'd to /var/www/cmipaportal/shared/.env.production) ─
#    ALL OPTIONAL — vps-bootstrap.sh auto-provisions sensible defaults.
#    Set any of these to override the VPS-side values.
#
#    APP_DATABASE_URL          — Postgres connection string. Default: local
#                                Postgres provisioned by vps-bootstrap.sh.
#    APP_AUTH_SECRET           — Auth.js session secret. Default: 32-byte
#                                random base64 generated by vps-bootstrap.sh.
#    APP_ANTHROPIC_API_KEY     — Claude API key (stub if empty)
#    APP_BLOB_READ_WRITE_TOKEN — Vercel Blob token (stub if empty)
#    APP_RESEND_API_KEY        — Resend email key (stub if empty)
#
#  On every deploy, the workflow rebuilds .env.production on the runner from
#  these secrets, scps it to the VPS atomically (chmod 600), then runs the
#  remote deploy script. NO manual SSH or file editing is ever required.
#
#  Security notes:
#    - All secrets are masked in workflow logs (GitHub Actions does this auto)
#    - The env file is uploaded to a temp path then atomically mv'd into place
#    - The runner copy is shredded before the job exits
#    - Password auth is mitigated by fail2ban on the server (5 fails/10min → 1h ban)
# -----------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/vps-deploy.sh'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:
    inputs:
      skip_build_cache:
        description: 'Skip npm cache (force fresh install)'
        type: boolean
        default: false

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight deploy

env:
  APP_NAME: cmipaportal
  APP_REMOTE_ROOT: /var/www/cmipaportal
  NODE_VERSION: '20'
  # Default SSH port to 22 when the VPS_PORT secret is missing or empty.
  # GitHub Actions `||` returns the right-hand side when the left is empty.
  VPS_PORT: ${{ secrets.VPS_PORT || '22' }}

jobs:
  # ===========================================================================
  #  1. BUILD on GitHub runner (fast feedback, no remote CPU cost)
  # ===========================================================================
  build:
    name: 🔨 Build artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app

    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🏷️  Compute release id
        id: meta
        run: |
          RELEASE_ID=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Release: $RELEASE_ID"

      - name: 🟢 Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ inputs.skip_build_cache && '' || 'npm' }}
          cache-dependency-path: app/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🧬 Prisma generate
        run: npx prisma generate

      - name: 🔍 Typecheck
        run: npm run typecheck

      - name: 🏗️  Build Next.js
        env:
          # Placeholder values — overridden at runtime by .env.production on VPS
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          AUTH_SECRET: placeholder-32-byte-string-for-build-step-only-x
          AUTH_TRUST_HOST: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: 📊 Build summary
        run: |
          echo "### 🏗️ Build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release | \`${{ steps.meta.outputs.release_id }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit  | \`${GITHUB_SHA::7}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| .next size | $(du -sh .next | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"

      - name: 📦 Package artifact
        run: |
          # Trim everything we don't need at runtime
          tar --exclude='node_modules' \
              --exclude='.git' \
              --exclude='.next/cache' \
              -czf /tmp/release.tar.gz \
              -C .. \
              app/.next \
              app/public \
              app/prisma \
              app/package.json \
              app/package-lock.json \
              app/next.config.ts \
              scripts/vps-deploy.sh \
              scripts/initial-seed.sql
          ls -lh /tmp/release.tar.gz

      - name: ⬆️  Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.meta.outputs.release_id }}
          path: /tmp/release.tar.gz
          retention-days: 14
          if-no-files-found: error

  # ===========================================================================
  #  2. DEPLOY  —  ship artifact to VPS, run vps-deploy.sh
  # ===========================================================================
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    environment:
      name: production
      url: https://cmipaportal.com

    steps:
      - name: ⬇️  Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.release_id }}
          path: /tmp

      - name: ✅ Validate required secrets
        env:
          VPS_HOST_CHECK: ${{ secrets.VPS_HOST }}
          VPS_USER_CHECK: ${{ secrets.VPS_USER }}
          VPS_PASS_CHECK: ${{ secrets.VPS_PASSWORD }}
        run: |
          missing=()
          [ -z "$VPS_HOST_CHECK" ] && missing+=("VPS_HOST")
          [ -z "$VPS_USER_CHECK" ] && missing+=("VPS_USER")
          [ -z "$VPS_PASS_CHECK" ] && missing+=("VPS_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✓ All required secrets present (VPS_PORT defaults to 22 if unset; using $VPS_PORT)"

      - name: 🔐 Setup SSH (password auth via sshpass)
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          # Install sshpass (lightweight, ~50KB)
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
            echo "SSH_OPTS=-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o PreferredAuthentications=password -o PubkeyAuthentication=no" >> "$GITHUB_ENV"
          else
            echo "::warning::VPS_KNOWN_HOSTS not set — using StrictHostKeyChecking=no (less secure; set it via ssh-keyscan -H <host>)"
            echo "SSH_OPTS=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no" >> "$GITHUB_ENV"
          fi

      - name: 📡 SSH preflight
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -p "$VPS_PORT" $SSH_OPTS \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'echo "Connected as $(whoami)@$(hostname) — uname=$(uname -srm)"'

      - name: 📤 Upload release artifact
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          RELEASE_ID="${{ needs.build.outputs.release_id }}"
          REMOTE_DIR="${APP_REMOTE_ROOT}/releases/${RELEASE_ID}"

          echo "→ Creating $REMOTE_DIR on VPS"
          sshpass -e ssh -p "$VPS_PORT" $SSH_OPTS \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p $REMOTE_DIR && rm -rf /tmp/release-${RELEASE_ID}.tar.gz"

          echo "→ Uploading artifact (scp)"
          sshpass -e scp -P "$VPS_PORT" $SSH_OPTS \
            /tmp/release.tar.gz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/release-${RELEASE_ID}.tar.gz

          echo "→ Extracting on VPS"
          sshpass -e ssh -p "$VPS_PORT" $SSH_OPTS \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "tar -xzf /tmp/release-${RELEASE_ID}.tar.gz -C $REMOTE_DIR --strip-components=0 && \
             rm /tmp/release-${RELEASE_ID}.tar.gz && \
             ls -la $REMOTE_DIR/app | head -20"

      - name: 🔑 Sync .env.production from GitHub Secrets
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          # ── Required ────────────────────────────────────────────────────
          APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
          APP_AUTH_SECRET:  ${{ secrets.APP_AUTH_SECRET }}
          # ── Optional integrations (graceful stubs if empty) ─────────────
          APP_ANTHROPIC_API_KEY:     ${{ secrets.APP_ANTHROPIC_API_KEY }}
          APP_BLOB_READ_WRITE_TOKEN: ${{ secrets.APP_BLOB_READ_WRITE_TOKEN }}
          APP_RESEND_API_KEY:        ${{ secrets.APP_RESEND_API_KEY }}
        run: |
          # Read VPS-side runtime config (PORT + local fallbacks set by bootstrap)
          REMOTE_RUNTIME=$(sshpass -e ssh -p "$VPS_PORT" $SSH_OPTS \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cat ${APP_REMOTE_ROOT}/shared/runtime.env 2>/dev/null" || echo "")
          REMOTE_PORT=$(echo "$REMOTE_RUNTIME"   | grep -E '^APP_PORT='            | cut -d= -f2)
          REMOTE_PORT="${REMOTE_PORT:-3000}"
          LOCAL_DB_URL=$(echo "$REMOTE_RUNTIME"  | grep -E '^LOCAL_DATABASE_URL='  | cut -d= -f2-)
          LOCAL_AUTH=$(echo "$REMOTE_RUNTIME"    | grep -E '^LOCAL_AUTH_SECRET='   | cut -d= -f2-)
          # Mask the local secrets in workflow logs
          [ -n "$LOCAL_DB_URL" ] && echo "::add-mask::$LOCAL_DB_URL"
          [ -n "$LOCAL_AUTH" ]   && echo "::add-mask::$LOCAL_AUTH"
          echo "→ Using PORT=$REMOTE_PORT (from VPS runtime.env)"

          # APP_* secrets win; fall back to bootstrap-generated values from VPS
          EFFECTIVE_DATABASE_URL="${APP_DATABASE_URL:-$LOCAL_DB_URL}"
          EFFECTIVE_AUTH_SECRET="${APP_AUTH_SECRET:-$LOCAL_AUTH}"

          if [ -z "$EFFECTIVE_DATABASE_URL" ]; then
            echo "::error::No DATABASE_URL available. Run vps-bootstrap.sh on the VPS"
            echo "(it provisions local Postgres) OR set APP_DATABASE_URL secret."
            exit 1
          fi
          if [ -z "$EFFECTIVE_AUTH_SECRET" ]; then
            echo "::error::No AUTH_SECRET available. Run vps-bootstrap.sh on the VPS"
            echo "(it generates one) OR set APP_AUTH_SECRET secret (openssl rand -base64 32)."
            exit 1
          fi

          # Source labelling for the deploy log
          DB_SOURCE=$([ -n "$APP_DATABASE_URL" ] && echo "APP_DATABASE_URL secret" || echo "VPS local Postgres")
          AUTH_SOURCE=$([ -n "$APP_AUTH_SECRET" ] && echo "APP_AUTH_SECRET secret" || echo "VPS local secret")
          echo "→ DATABASE_URL source: $DB_SOURCE"
          echo "→ AUTH_SECRET source:  $AUTH_SOURCE"

          # Build .env.production on the runner — never logged
          TMP_ENV="$(mktemp)"
          {
            echo "# Auto-written by GitHub Actions on $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "# Source: GitHub repository secrets. DO NOT EDIT MANUALLY."
            echo "# To change a value, update the secret in GitHub and re-deploy."
            echo ""
            echo "DATABASE_URL=\"${EFFECTIVE_DATABASE_URL}\""
            echo "AUTH_SECRET=\"${EFFECTIVE_AUTH_SECRET}\""
            echo "AUTH_URL=\"https://cmipaportal.com\""
            echo "NEXTAUTH_URL=\"https://cmipaportal.com\""
            echo "NODE_ENV=\"production\""
            echo "PORT=${REMOTE_PORT}"
            echo "AUTH_TRUST_HOST=\"true\""
            echo ""
            echo "# Optional integrations (empty = use graceful stubs)"
            echo "ANTHROPIC_API_KEY=\"${APP_ANTHROPIC_API_KEY}\""
            echo "BLOB_READ_WRITE_TOKEN=\"${APP_BLOB_READ_WRITE_TOKEN}\""
            echo "RESEND_API_KEY=\"${APP_RESEND_API_KEY}\""
          } > "$TMP_ENV"
          chmod 600 "$TMP_ENV"

          # Ensure shared/ exists (user owns /var/www/$APP_NAME after bootstrap)
          sshpass -e ssh -p "$VPS_PORT" $SSH_OPTS \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p ${APP_REMOTE_ROOT}/shared"

          # Upload to a temp path first, then atomic mv (no half-written window)
          REMOTE_TMP="/tmp/.env.production.$$"
          sshpass -e scp -P "$VPS_PORT" $SSH_OPTS \
            "$TMP_ENV" \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:"$REMOTE_TMP"

          sshpass -e ssh -p "$VPS_PORT" $SSH_OPTS \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mv $REMOTE_TMP ${APP_REMOTE_ROOT}/shared/.env.production && \
             chmod 600 ${APP_REMOTE_ROOT}/shared/.env.production && \
             echo '✓ .env.production synced ('$(wc -l < ${APP_REMOTE_ROOT}/shared/.env.production)' lines)'"

          # Wipe the local copy from the runner FS (the runner is ephemeral
          # anyway, but belt-and-suspenders)
          shred -u "$TMP_ENV" 2>/dev/null || rm -f "$TMP_ENV"

      - name: 🚀 Run remote deploy script
        id: remote_deploy
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          RELEASE_ID="${{ needs.build.outputs.release_id }}"
          REMOTE_SCRIPT="${APP_REMOTE_ROOT}/releases/${RELEASE_ID}/scripts/vps-deploy.sh"

          # The artifact contains scripts/vps-deploy.sh — make it executable & run it
          sshpass -e ssh -p "$VPS_PORT" $SSH_OPTS \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "chmod +x $REMOTE_SCRIPT && APP_NAME=${APP_NAME} bash $REMOTE_SCRIPT $RELEASE_ID"

      - name: 🩺 Post-deploy smoke test (public URL)
        run: |
          set -e
          URL="https://cmipaportal.com"
          echo "→ Checking $URL"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L -m 10 "$URL" || echo "000")
            echo "  attempt $i → HTTP $STATUS"
            if [[ "$STATUS" =~ ^(200|301|302|307|308)$ ]]; then
              echo "✅ Site reachable"
              exit 0
            fi
            sleep 3
          done
          echo "::warning::Site did not return 2xx/3xx — check nginx/DNS/SSL"

      - name: 📋 Deploy summary
        if: always()
        run: |
          {
            echo "### 🚀 Deploy summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Release | \`${{ needs.build.outputs.release_id }}\` |"
            echo "| Commit  | [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |"
            echo "| URL     | https://cmipaportal.com |"
            echo "| Status  | ${{ steps.remote_deploy.outcome }} |"
            echo ""
            echo "Server-side log: \`/var/log/cmipaportal/deploy-${{ needs.build.outputs.release_id }}.log\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔥 Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy failed — VPS rolled back to previous release automatically."
          echo "Inspect server log: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'tail -200 /var/log/cmipaportal/deploy-${{ needs.build.outputs.release_id }}.log'"

      - name: 🧹 Cleanup
        if: always()
        run: |
          # Belt-and-suspenders: scrub any sshpass remnants from the runner
          rm -f ~/.ssh/known_hosts || true
          unset SSHPASS || true
