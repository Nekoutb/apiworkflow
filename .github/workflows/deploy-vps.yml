name: Deploy to VPS (cmipaportal.com)

# -----------------------------------------------------------------------------
#  CI/CD: build the Next.js app on GitHub runners, then atomically deploy it
#  to the production VPS via SSH.
#
#  Triggers:
#    - Push to main (auto-deploy)
#    - Manual: Actions tab → "Deploy to VPS" → Run workflow
#
#  Required GitHub Secrets (set under Settings → Secrets and variables → Actions):
#
#  ── SSH transport ────────────────────────────────────────────────────────────
#    VPS_HOST            — server IP (e.g. 45.32.150.96)
#    VPS_USER            — Linux user on the server (you chose this manually)
#    VPS_PASSWORD        — SSH password for VPS_USER (you set with `passwd`)
#    VPS_PORT            — SSH port (OPTIONAL — defaults to 22)
#    VPS_KNOWN_HOSTS     — output of `ssh-keyscan -H <VPS_HOST>`
#                          (OPTIONAL but recommended)
#
#  NO APP_* SECRETS ARE NEEDED. The deploy script (vps-deploy.sh) self-heals
#  on every run — it generates AUTH_SECRET on first deploy, derives
#  DATABASE_URL from the local PostgreSQL set up by vps-bootstrap.sh, and
#  writes .env.production itself, entirely from VPS-local state.
#
#  Persistent secrets on the VPS (created on first deploy, never rotated):
#    /var/www/cmipaportal/shared/.auth-secret   (mode 600, openssl rand -base64 32)
#    /var/www/cmipaportal/shared/.db-password   (mode 600, 28-char random)
#
#  Security notes:
#    - Password auth is mitigated by fail2ban (5 fails/10min → 1h ban)
#    - Optional integrations (Anthropic, Resend, Vercel Blob) default to
#      empty stubs. Edit shared/.env.production manually to add API keys.
# -----------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/vps-deploy.sh'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:
    inputs:
      skip_build_cache:
        description: 'Skip npm cache (force fresh install)'
        type: boolean
        default: false

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight deploy

env:
  APP_NAME: cmipaportal
  APP_REMOTE_ROOT: /var/www/cmipaportal
  NODE_VERSION: '20'
  # Default SSH port to 22 when the VPS_PORT secret is missing or empty.
  # GitHub Actions `||` returns the right-hand side when the left is empty.
  VPS_PORT: ${{ secrets.VPS_PORT || '22' }}

jobs:
  # ===========================================================================
  #  1. BUILD on GitHub runner (fast feedback, no remote CPU cost)
  # ===========================================================================
  build:
    name: 🔨 Build artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app

    # No `outputs:` block. We DELIBERATELY avoid passing a generated
    # release_id between jobs — GitHub Actions does substring-matching of
    # output values against ALL repo secrets. Even tiny fragments like "22"
    # (which is in our VPS_HOST IP 185.92.222.217) trigger masking, and a
    # masked output becomes empty in the downstream job. That breaks
    # `name: release-${{ ... }}` → `name: release-` → artifact-not-found.
    # See: https://docs.github.com/en/actions/security-guides/...secrets
    #
    # Instead the artifact gets a fixed name (`release`) and the deploy
    # job generates its own unique release id locally on the VPS.

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🟢 Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ inputs.skip_build_cache && '' || 'npm' }}
          cache-dependency-path: app/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🧬 Prisma generate
        run: npx prisma generate

      - name: 🔍 Typecheck
        run: npm run typecheck

      - name: 🏗️  Build Next.js
        env:
          # Placeholder values — overridden at runtime by .env.production on VPS
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          AUTH_SECRET: placeholder-32-byte-string-for-build-step-only-x
          AUTH_TRUST_HOST: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: 📊 Build summary
        run: |
          echo "### 🏗️ Build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit  | \`${GITHUB_SHA::7}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| .next size | $(du -sh .next | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"

      - name: 📦 Package artifact
        run: |
          # Trim everything we don't need at runtime
          tar --exclude='node_modules' \
              --exclude='.git' \
              --exclude='.next/cache' \
              -czf /tmp/release.tar.gz \
              -C .. \
              app/.next \
              app/public \
              app/prisma \
              app/package.json \
              app/package-lock.json \
              app/next.config.ts \
              app/server.js \
              scripts/vps-deploy.sh \
              scripts/initial-seed.sql
          ls -lh /tmp/release.tar.gz

      - name: ⬆️  Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # Fixed name. Per-run uniqueness is guaranteed by the workflow run.
          # Cannot embed a generated id here — see comment at top of `outputs:`.
          name: release
          path: /tmp/release.tar.gz
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # ===========================================================================
  #  2. DEPLOY  —  ship artifact to VPS, run vps-deploy.sh
  # ===========================================================================
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    environment:
      name: production
      url: https://cmipaportal.com

    steps:
      - name: ⬇️  Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release
          path: /tmp

      - name: 🏷️  Compute release id (local, no cross-job output)
        id: meta
        run: |
          # Generated inside the deploy job so the value never crosses a job
          # boundary as a step output (which would trigger secret-substring
          # masking — see comment in the build job). Used for the per-release
          # folder name on the VPS only.
          RELEASE_ID="$(date -u +%Y%m%d-%H%M%S)-r${GITHUB_RUN_NUMBER}"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "Release: $RELEASE_ID  (commit: ${GITHUB_SHA::7})"

      - name: ✅ Validate required secrets
        env:
          VPS_HOST_CHECK: ${{ secrets.VPS_HOST }}
          VPS_USER_CHECK: ${{ secrets.VPS_USER }}
          VPS_PASS_CHECK: ${{ secrets.VPS_PASSWORD }}
        run: |
          missing=()
          [ -z "$VPS_HOST_CHECK" ] && missing+=("VPS_HOST")
          [ -z "$VPS_USER_CHECK" ] && missing+=("VPS_USER")
          [ -z "$VPS_PASS_CHECK" ] && missing+=("VPS_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✓ All required secrets present (VPS_PORT defaults to 22 if unset; using $VPS_PORT)"

      - name: 🔐 Setup SSH (password auth via sshpass)
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          # Install sshpass (lightweight, ~50KB)
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
            echo "SSH_OPTS=-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o PreferredAuthentications=password -o PubkeyAuthentication=no" >> "$GITHUB_ENV"
          else
            echo "::warning::VPS_KNOWN_HOSTS not set — using StrictHostKeyChecking=no (less secure; set it via ssh-keyscan -H <host>)"
            echo "SSH_OPTS=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no" >> "$GITHUB_ENV"
          fi

      - name: 📡 SSH preflight
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -p "$VPS_PORT" $SSH_OPTS \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'echo "Connected as $(whoami)@$(hostname) — uname=$(uname -srm)"'

      - name: 📤 Upload release artifact
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          # RELEASE_ID was set into $GITHUB_ENV by the "Compute release id" step
          REMOTE_DIR="${APP_REMOTE_ROOT}/releases/${RELEASE_ID}"

          echo "→ Ensuring $APP_REMOTE_ROOT exists (sudo on first run) + creating $REMOTE_DIR"
          # On a fresh VPS, /var/www/$APP_NAME doesn't exist and the user
          # can't write to /var/www. We use sudo install once to create the
          # root + chown to the SSH user. On subsequent deploys this is a
          # no-op (dir exists). Requires NOPASSWD sudo for the SSH user.
          sshpass -e ssh -p "$VPS_PORT" $SSH_OPTS \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
              if [ ! -d ${APP_REMOTE_ROOT} ]; then
                sudo install -d -m 755 -o \$(whoami) -g \$(whoami) ${APP_REMOTE_ROOT}
                sudo install -d -m 755 -o \$(whoami) -g \$(whoami) ${APP_REMOTE_ROOT}/releases ${APP_REMOTE_ROOT}/shared ${APP_REMOTE_ROOT}/shared/logs
              fi
              mkdir -p $REMOTE_DIR
              rm -rf /tmp/release-${RELEASE_ID}.tar.gz
            "

          echo "→ Uploading artifact (scp)"
          sshpass -e scp -P "$VPS_PORT" $SSH_OPTS \
            /tmp/release.tar.gz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/release-${RELEASE_ID}.tar.gz

          echo "→ Extracting on VPS"
          sshpass -e ssh -p "$VPS_PORT" $SSH_OPTS \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "tar -xzf /tmp/release-${RELEASE_ID}.tar.gz -C $REMOTE_DIR --strip-components=0 && \
             rm /tmp/release-${RELEASE_ID}.tar.gz && \
             ls -la $REMOTE_DIR/app | head -20"

      - name: 🔑 Sync Anthropic API key to VPS (optional)
        # Lets the operator enable the AI features WITHOUT any server login:
        # set the ANTHROPIC_API_KEY repo secret, and this step writes it to
        # shared/.anthropic-key on the VPS (mode 600), which vps-deploy.sh then
        # folds into .env.production. The secret travels over ssh STDIN (piped
        # into `cat`), never as a command-line argument, so it can't leak via
        # the VPS process list. Skips cleanly when the secret is unset.
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ℹ No ANTHROPIC_API_KEY repo secret set — skipping. App stays in AI demo mode."
            exit 0
          fi
          echo "→ Sending key to ${APP_REMOTE_ROOT}/shared/.anthropic-key via stdin (not argv)"
          printf '%s' "$ANTHROPIC_API_KEY" | sshpass -e ssh -p "$VPS_PORT" $SSH_OPTS \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "umask 077; mkdir -p ${APP_REMOTE_ROOT}/shared && cat > ${APP_REMOTE_ROOT}/shared/.anthropic-key && chmod 600 ${APP_REMOTE_ROOT}/shared/.anthropic-key && echo '✓ key stored on VPS'"

      - name: 🚀 Run remote deploy script
        id: remote_deploy
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          # RELEASE_ID from $GITHUB_ENV (set by the "Compute release id" step)
          REMOTE_SCRIPT="${APP_REMOTE_ROOT}/releases/${RELEASE_ID}/scripts/vps-deploy.sh"

          # The artifact contains scripts/vps-deploy.sh — make it executable & run it
          sshpass -e ssh -p "$VPS_PORT" $SSH_OPTS \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "chmod +x $REMOTE_SCRIPT && APP_NAME=${APP_NAME} bash $REMOTE_SCRIPT $RELEASE_ID"

      - name: 🩺 Post-deploy smoke test (public URL)
        run: |
          DOMAIN="cmipaportal.com"
          echo "═══════════════════════════════════════════════════════════"
          echo "  Smoke test for https://${DOMAIN}"
          echo "═══════════════════════════════════════════════════════════"

          # Resolve DNS first — most "000" failures are DNS not pointing
          echo "→ Resolving DNS..."
          RESOLVED=$(getent hosts "$DOMAIN" | awk '{print $1; exit}')
          if [ -z "$RESOLVED" ]; then
            echo "::warning::DNS does NOT resolve for ${DOMAIN}"
            echo ""
            echo "  Fix: at your registrar (where you bought ${DOMAIN}), add:"
            echo "    Type=A  Name=@    Value=${{ secrets.VPS_HOST }}"
            echo "    Type=A  Name=www  Value=${{ secrets.VPS_HOST }}"
            echo "  Wait 5-30 min for propagation, then re-deploy."
            exit 0
          fi
          echo "  ${DOMAIN} → ${RESOLVED}"
          if [ "$RESOLVED" != "${{ secrets.VPS_HOST }}" ]; then
            echo "::warning::DNS resolves to ${RESOLVED}, expected ${{ secrets.VPS_HOST }}"
            echo "  Update the A record then re-deploy."
            exit 0
          fi
          echo "  ✓ DNS matches VPS IP"

          # Try HTTP first (always works once nginx is up — even without SSL)
          echo "→ HTTP (port 80)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "http://${DOMAIN}" || echo "000")
          echo "  HTTP → $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "000" ]; then
            echo "::warning::Cannot connect to port 80 — nginx not serving or firewall blocking"
            exit 0
          fi

          # Then HTTPS (only works after Let's Encrypt issued the cert)
          echo "→ HTTPS (port 443)..."
          for i in {1..5}; do
            HTTPS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L -m 10 "https://${DOMAIN}" || echo "000")
            echo "  attempt $i → HTTPS $HTTPS_STATUS"
            if [[ "$HTTPS_STATUS" =~ ^(200|301|302|307|308)$ ]]; then
              echo "✅ Site fully reachable on HTTPS"
              exit 0
            fi
            sleep 3
          done

          # HTTP works but HTTPS doesn't → SSL not yet issued (DNS was probably
          # only recently fixed; certbot needs another deploy to retry)
          if [[ "$HTTP_STATUS" =~ ^(200|301|302|307|308)$ ]]; then
            echo "::warning::HTTP works ($HTTP_STATUS) but HTTPS doesn't — SSL cert not yet issued."
            echo "  The deploy script attempted certbot. Re-trigger the deploy and watch the"
            echo "  '6b. Ensure nginx + SSL' step in the deploy log on the VPS."
          else
            echo "::warning::Site reachable on neither HTTP nor HTTPS — see nginx logs on VPS"
          fi

      - name: 📋 Deploy summary
        if: always()
        run: |
          {
            echo "### 🚀 Deploy summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Release | \`${{ env.RELEASE_ID }}\` |"
            echo "| Commit  | [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |"
            echo "| URL     | https://cmipaportal.com |"
            echo "| Status  | ${{ steps.remote_deploy.outcome }} |"
            echo ""
            echo "Server-side log: \`/var/log/cmipaportal/deploy-${{ env.RELEASE_ID }}.log\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔥 Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy failed — VPS rolled back to previous release automatically."
          echo "Inspect server log: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'tail -200 /var/log/cmipaportal/deploy-${{ env.RELEASE_ID }}.log'"

      - name: 🧹 Cleanup
        if: always()
        run: |
          # Belt-and-suspenders: scrub any sshpass remnants from the runner
          rm -f ~/.ssh/known_hosts || true
          unset SSHPASS || true
