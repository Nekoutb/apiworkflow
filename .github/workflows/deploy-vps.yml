name: Deploy to VPS (cmipaportal.com)

# -----------------------------------------------------------------------------
#  CI/CD: build the Next.js app on GitHub runners, then atomically deploy it
#  to the production VPS via SSH.
#
#  Triggers:
#    - Push to main (auto-deploy)
#    - Manual: Actions tab → "Deploy to VPS" → Run workflow
#
#  Required GitHub Secrets (set under Settings → Secrets and variables → Actions):
#    VPS_HOST           — server IP (e.g. 45.32.150.96)
#    VPS_USER           — deploy user on the server (e.g. "deploy")
#    VPS_PORT           — SSH port (usually 22)
#    VPS_PASSWORD       — SSH password for the deploy user (printed by
#                         scripts/vps-bootstrap.sh). Stored encrypted in
#                         GitHub Secrets, never echoed to logs.
#    VPS_KNOWN_HOSTS    — output of: ssh-keyscan -H <VPS_HOST>
#                         (optional but recommended; falls back to StrictHostKeyChecking=no)
#
#  No build-time secrets are needed — the app reads its real env at runtime
#  from /var/www/cmipaportal/shared/.env.production (set during bootstrap).
#
#  Security note: password auth is less robust than SSH keys. We mitigate by
#  installing fail2ban on the server (5 fails / 10min → 1h ban) and keeping
#  the password only in GitHub Secrets + root-owned file on the VPS.
# -----------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/vps-deploy.sh'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:
    inputs:
      skip_build_cache:
        description: 'Skip npm cache (force fresh install)'
        type: boolean
        default: false

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight deploy

env:
  APP_NAME: cmipaportal
  APP_REMOTE_ROOT: /var/www/cmipaportal
  NODE_VERSION: '20'

jobs:
  # ===========================================================================
  #  1. BUILD on GitHub runner (fast feedback, no remote CPU cost)
  # ===========================================================================
  build:
    name: 🔨 Build artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app

    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🏷️  Compute release id
        id: meta
        run: |
          RELEASE_ID=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Release: $RELEASE_ID"

      - name: 🟢 Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ inputs.skip_build_cache && '' || 'npm' }}
          cache-dependency-path: app/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🧬 Prisma generate
        run: npx prisma generate

      - name: 🔍 Typecheck
        run: npm run typecheck

      - name: 🏗️  Build Next.js
        env:
          # Placeholder values — overridden at runtime by .env.production on VPS
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          AUTH_SECRET: placeholder-32-byte-string-for-build-step-only-x
          AUTH_TRUST_HOST: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: 📊 Build summary
        run: |
          echo "### 🏗️ Build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release | \`${{ steps.meta.outputs.release_id }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit  | \`${GITHUB_SHA::7}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| .next size | $(du -sh .next | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"

      - name: 📦 Package artifact
        run: |
          # Trim everything we don't need at runtime
          tar --exclude='node_modules' \
              --exclude='.git' \
              --exclude='.next/cache' \
              -czf /tmp/release.tar.gz \
              -C .. \
              app/.next \
              app/public \
              app/prisma \
              app/package.json \
              app/package-lock.json \
              app/next.config.ts \
              scripts/vps-deploy.sh
          ls -lh /tmp/release.tar.gz

      - name: ⬆️  Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.meta.outputs.release_id }}
          path: /tmp/release.tar.gz
          retention-days: 14
          if-no-files-found: error

  # ===========================================================================
  #  2. DEPLOY  —  ship artifact to VPS, run vps-deploy.sh
  # ===========================================================================
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    environment:
      name: production
      url: https://cmipaportal.com

    steps:
      - name: ⬇️  Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.release_id }}
          path: /tmp

      - name: 🔐 Setup SSH (password auth via sshpass)
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          # Install sshpass (lightweight, ~50KB)
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
            echo "SSH_OPTS=-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o PreferredAuthentications=password -o PubkeyAuthentication=no" >> "$GITHUB_ENV"
          else
            echo "::warning::VPS_KNOWN_HOSTS not set — using StrictHostKeyChecking=no (less secure; set it via ssh-keyscan -H <host>)"
            echo "SSH_OPTS=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no" >> "$GITHUB_ENV"
          fi

      - name: 📡 SSH preflight
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ secrets.VPS_PORT }} $SSH_OPTS \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'echo "Connected as $(whoami)@$(hostname) — uname=$(uname -srm)"'

      - name: 📤 Upload release artifact
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          RELEASE_ID="${{ needs.build.outputs.release_id }}"
          REMOTE_DIR="${APP_REMOTE_ROOT}/releases/${RELEASE_ID}"

          echo "→ Creating $REMOTE_DIR on VPS"
          sshpass -e ssh -p ${{ secrets.VPS_PORT }} $SSH_OPTS \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p $REMOTE_DIR && rm -rf /tmp/release-${RELEASE_ID}.tar.gz"

          echo "→ Uploading artifact (scp)"
          sshpass -e scp -P ${{ secrets.VPS_PORT }} $SSH_OPTS \
            /tmp/release.tar.gz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/release-${RELEASE_ID}.tar.gz

          echo "→ Extracting on VPS"
          sshpass -e ssh -p ${{ secrets.VPS_PORT }} $SSH_OPTS \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "tar -xzf /tmp/release-${RELEASE_ID}.tar.gz -C $REMOTE_DIR --strip-components=0 && \
             rm /tmp/release-${RELEASE_ID}.tar.gz && \
             ls -la $REMOTE_DIR/app | head -20"

      - name: 🚀 Run remote deploy script
        id: remote_deploy
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          RELEASE_ID="${{ needs.build.outputs.release_id }}"
          REMOTE_SCRIPT="${APP_REMOTE_ROOT}/releases/${RELEASE_ID}/scripts/vps-deploy.sh"

          # The artifact contains scripts/vps-deploy.sh — make it executable & run it
          sshpass -e ssh -p ${{ secrets.VPS_PORT }} $SSH_OPTS \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "chmod +x $REMOTE_SCRIPT && APP_NAME=${APP_NAME} bash $REMOTE_SCRIPT $RELEASE_ID"

      - name: 🩺 Post-deploy smoke test (public URL)
        run: |
          set -e
          URL="https://cmipaportal.com"
          echo "→ Checking $URL"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L -m 10 "$URL" || echo "000")
            echo "  attempt $i → HTTP $STATUS"
            if [[ "$STATUS" =~ ^(200|301|302|307|308)$ ]]; then
              echo "✅ Site reachable"
              exit 0
            fi
            sleep 3
          done
          echo "::warning::Site did not return 2xx/3xx — check nginx/DNS/SSL"

      - name: 📋 Deploy summary
        if: always()
        run: |
          {
            echo "### 🚀 Deploy summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Release | \`${{ needs.build.outputs.release_id }}\` |"
            echo "| Commit  | [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |"
            echo "| URL     | https://cmipaportal.com |"
            echo "| Status  | ${{ steps.remote_deploy.outcome }} |"
            echo ""
            echo "Server-side log: \`/var/log/cmipaportal/deploy-${{ needs.build.outputs.release_id }}.log\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔥 Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy failed — VPS rolled back to previous release automatically."
          echo "Inspect server log: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'tail -200 /var/log/cmipaportal/deploy-${{ needs.build.outputs.release_id }}.log'"

      - name: 🧹 Cleanup
        if: always()
        run: |
          # Belt-and-suspenders: scrub any sshpass remnants from the runner
          rm -f ~/.ssh/known_hosts || true
          unset SSHPASS || true
