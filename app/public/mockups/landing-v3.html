<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V3 · Ultra-minimal · API Cameroun</title>
  <style>
    :root {
      --obsidian: #0d1822;
      --ink: #1a1612;
      --ink-2: #3c372d;
      --ink-3: #5b554a;
      --ink-4: #9c9485;
      --gold-500: #d4a72c;
      --gold-700: #a37e1e;
      --cmred: #b22234;
      --line: #e8e3d6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--ink);
      background: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .lang-toggle {
      position: absolute;
      top: 24px;
      right: 24px;
      display: inline-flex;
      gap: 2px;
      z-index: 3;
    }
    .lang-toggle button {
      background: transparent;
      border: none;
      padding: 4px 8px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-4);
      cursor: pointer;
      letter-spacing: 0.1em;
    }
    .lang-toggle button.active { color: var(--ink); border-bottom: 1.5px solid var(--gold-600); }
    .lang-toggle button + button::before {
      content: '|';
      color: var(--line);
      margin-right: 8px;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
      max-width: 480px;
      margin: 0 auto;
    }
    .seal {
      width: 64px; height: 64px;
      background: var(--obsidian);
      color: var(--gold-500);
      font-family: Georgia, serif;
      font-weight: 700;
      font-size: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 28px;
    }
    .seal::after {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(212, 167, 44, 0.5);
    }
    .org-name {
      font-family: Georgia, serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink-2);
      margin-bottom: 4px;
    }
    .republic {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-4);
      margin-bottom: 36px;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.4px;
      line-height: 1.15;
      margin-bottom: 12px;
    }
    .lead {
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--ink-3);
      margin-bottom: 32px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--obsidian);
      color: var(--gold-500);
      border: none;
      padding: 13px 28px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, gap 0.2s;
    }
    .cta:hover { background: var(--ink); gap: 14px; }
    .restricted {
      margin-top: 20px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--cmred);
    }
    footer {
      flex-shrink: 0;
      text-align: center;
      padding: 16px 24px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-4);
      border-top: 1px solid var(--line);
    }
    footer .star { color: var(--gold-500); }
  </style>
</head>
<body>
  <div class="lang-toggle">
    <button class="active">FR</button>
    <button>EN</button>
  </div>

  <main>
    <div class="seal">A</div>
    <div class="org-name">Agence de Promotion des Investissements</div>
    <div class="republic">République du Cameroun</div>

    <h1>Connexion personnel</h1>
    <p class="lead">
      Plateforme interne de traitement et de suivi des dossiers
      d'investissement.
    </p>

    <a href="#" class="cta">🔐 Se connecter <span>→</span></a>

    <div class="restricted">⚠ Accès réservé · activité tracée</div>
  </main>

  <footer>
    <span class="star">⚜</span> API Cameroun · Portail interne · © MMXXVI <span class="star">⚜</span>
  </footer>
</body>
</html>
