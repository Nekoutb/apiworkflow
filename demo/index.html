// ============================================================
// === ACTION PANEL
// ============================================================

function renderActionPanel(d, isMine) {
  const u = currentUser();
  const stage = STAGES.find(s => s.role === u.id);

  if (d.state === 'ACCREDITED') {
    return `
      <div class="card">
        <div class="card-title">État final</div>
        <div style="padding:14px;background:var(--success-bg);border-radius:8px;color:var(--success);font-weight:500">
          ✓ Convention signée — agrément délivré
        </div>
        <button class="btn primary" style="width:100%;margin-top:12px;justify-content:center" data-action="view-acte" data-id="${d.id}">
          📜 Voir l'acte d'agrément
        </button>
      </div>
    `;
  }

  if (d.state === 'REJECTED') {
    return `
      <div class="card">
        <div class="card-title">Dossier rejeté</div>
        <div style="padding:14px;background:var(--danger-bg);border-radius:8px;color:var(--danger);font-weight:500">
          ✕ Le dossier a été rejeté.
        </div>
      </div>
    `;
  }

  if (!isMine) {
    const owner = STATE_TO_ROLE[d.state];
    const ownerRole = ROLES.find(r => r.id === owner);
    return `
      <div class="card">
        <div class="card-title">Action requise</div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px">
          Ce dossier n'est pas dans votre corbeille. Il attend une action de :
        </p>
        <div style="padding:12px;background:var(--bg);border-radius:8px;margin-bottom:10px">
          <div style="font-weight:500;font-size:13.5px">${ownerRole.name}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${ownerRole.title}</div>
        </div>
        <button class="btn primary" style="width:100%;justify-content:center" data-action="switch-role" data-role="${owner}">
          Se connecter en tant que ${ownerRole.name}
        </button>
      </div>
    `;
  }

  // It's mine. Render the appropriate action form.
  const actionLabel = stage.actionLabel;
  return `
    <div class="card">
      <div class="card-title">
        ✏ Action à effectuer
        <span class="pill green">À traiter</span>
      </div>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:14px">
        Connecté en tant que <strong style="color:var(--text)">${u.name}</strong> (${stage.long}).
      </div>

      ${renderActionSpecificFields(d, u)}

      <label>Commentaire / motivation</label>
      <textarea id="actionComment" placeholder="${getCommentPlaceholder(u.id)}"></textarea>

      <div class="action-buttons">
        ${(() => {
          // Block "issue receipt" if reception and not all docs accepted
          if (u.id === 'reception' && d.state === 'SUBMITTED') {
            const allAccepted = d.documents.length > 0 && d.documents.every(x => x.verification === 'accepted');
            if (!allAccepted) {
              return `<button class="btn primary" disabled title="${state.language === 'fr' ? 'Toutes les pièces doivent être acceptées' : 'All documents must be accepted'}">${getApproveLabel(u.id)} →</button>`;
            }
          }
          return `<button class="btn primary" data-action="approve-forward" data-id="${d.id}">${getApproveLabel(u.id)} →</button>`;
        })()}
        <button class="btn warning" data-action="return-dossier" data-id="${d.id}">
          ↶ ${state.language === 'fr' ? 'Retourner pour complément' : 'Return for completion'}
        </button>
        <button class="btn danger" data-action="reject-dossier" data-id="${d.id}">
          ✕ ${state.language === 'fr' ? 'Rejeter' : 'Reject'}
        </button>
      </div>

      <div class="role-tag allowed">
        ✓ Étape ${stage.short} · Article ${getArticleRef(u.id)}
      </div>
    </div>
  `;
}

function renderActionSpecificFields(d, u) {
  if (u.id === 'reception') {
    const total = d.documents.length;
    const accepted = d.documents.filter(x => x.verification === 'accepted').length;
    const rejected = d.documents.filter(x => x.verification === 'rejected').length;
    const pending  = d.documents.filter(x => x.verification === 'pending').length;
    const allAccepted = total > 0 && accepted === total;
    return `
      <div style="padding:11px 13px;background:${allAccepted ? 'var(--success-bg)' : 'var(--warning-bg)'};border-radius:7px;font-size:12.5px;color:${allAccepted ? 'var(--success)' : 'var(--warning)'};margin-bottom:8px">
        <strong>${state.language === 'fr' ? 'Contrôle de complétude :' : 'Completeness check:'}</strong>
        ${total}/6 ${state.language === 'fr' ? 'pièces' : 'documents'} ·
        ✓ ${accepted} ${t('pill.accepted').toLowerCase()} ·
        ⏳ ${pending} ${t('pill.pending').toLowerCase()} ·
        ✕ ${rejected} ${t('pill.rejected').toLowerCase()}
        ${!allAccepted ? '<br>' + (state.language === 'fr' ? 'Allez à l\'onglet « Documents » pour vérifier chaque pièce avant de délivrer le récépissé.' : 'Go to the "Documents" tab to verify each item before issuing the receipt.') : ''}
      </div>
      <label>${state.language === 'fr' ? 'N° de récépissé à délivrer' : 'Receipt number to issue'}</label>
      <input type="text" style="width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:6px;font:inherit;font-size:13px" value="2025/R${String(100 + state.counter - 26).padStart(4,'0')}" id="recepNo" ${allAccepted ? '' : 'disabled'}>
    `;
  }
  if (u.id === 'instruction') {
    return `
      <div style="padding:11px 13px;background:var(--info-bg);border-radius:7px;font-size:12.5px;color:var(--info);margin-bottom:8px">
        <strong>Vérification technique :</strong> Critères d'éligibilité (Art. 6, ${d.type === 'new' ? '7' : '8'}), cohérence du programme d'investissement.
      </div>
      <label>Avis technique</label>
      <select id="opinionPosition" style="width:100%">
        <option value="favorable">Favorable</option>
        <option value="favorable_reserve">Favorable avec réserves</option>
        <option value="unfavorable">Défavorable</option>
      </select>
    `;
  }
  if (u.id === 'tax') {
    return `
      <div style="padding:11px 13px;background:var(--info-bg);border-radius:7px;font-size:12.5px;color:var(--info);margin-bottom:8px">
        <strong>Avis fiscal obligatoire (Art. 30.5) :</strong> Régime fiscal applicable, régularité fiscale, conformité Art. 11.
      </div>
      <label>Position de l'administration fiscale</label>
      <select id="opinionPosition" style="width:100%">
        <option value="favorable">Favorable</option>
        <option value="favorable_reserve">Favorable avec réserves</option>
        <option value="unfavorable">Défavorable</option>
      </select>
      <label>Régime fiscal proposé</label>
      <div style="padding:10px;background:var(--bg);border-radius:6px;font-size:13px">
        Catégorie ${categoryFor(d.amount)}${d.isZdp ? ' + uplift ZDP' : ''} · crédit d'impôt ${getCredit(d)}%
      </div>
    `;
  }
  if (u.id === 'customs') {
    return `
      <div style="padding:11px 13px;background:var(--info-bg);border-radius:7px;font-size:12.5px;color:var(--info);margin-bottom:8px">
        <strong>Avis douanier obligatoire (Art. 30.5) :</strong> Validation de la liste prévisionnelle d'équipements (Art. 33).
      </div>
      <label>Position de l'administration douanière</label>
      <select id="opinionPosition" style="width:100%">
        <option value="favorable">Favorable</option>
        <option value="favorable_reserve">Favorable avec réserves</option>
        <option value="unfavorable">Défavorable</option>
      </select>
    `;
  }
  if (u.id === 'chef_gu') {
    const allAvis = d.avis.length >= 3;
    return `
      <div style="padding:11px 13px;background:${allAvis ? 'var(--success-bg)' : 'var(--warning-bg)'};border-radius:7px;font-size:12.5px;color:${allAvis ? 'var(--success)' : 'var(--warning)'};margin-bottom:8px">
        <strong>Synthèse du dossier :</strong> ${allAvis ? '✓ Les 3 avis sont présents (instruction, fiscal, douanier).' : '⚠ Avis manquants — la transmission au DG est bloquée.'}
      </div>
      <label>Projet de convention (Art. 31)</label>
      <div style="padding:10px;background:var(--bg);border-radius:6px;font-size:12.5px;line-height:1.6">
        ✓ Raison sociale, NIU, objet, lieu d'implantation<br>
        ✓ Durée d'installation (${d.installationMonths} mois) + exploitation 5 ans<br>
        ✓ Avantages consentis (Cat. ${categoryFor(d.amount)}${d.isZdp ? ' + ZDP' : ''})<br>
        ✓ Engagements vis-à-vis de l'État<br>
        ✓ Liste prévisionnelle des équipements<br>
        ✓ Modalités de contrôle et sanctions
      </div>
    `;
  }
  if (u.id === 'dg') {
    return `
      <div style="padding:11px 13px;background:var(--success-bg);border-radius:7px;font-size:12.5px;color:var(--success);margin-bottom:8px">
        <strong>Signature de la convention d'investissement.</strong> En signant, vous délivrez l'acte d'agrément définitif.
      </div>
      <label>N° d'agrément à attribuer</label>
      <input type="text" style="width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:6px;font:inherit;font-size:13px" value="API/2025/AG/${String(state.counter).padStart(4,'0')}" id="agreementNo">
    `;
  }
  return '';
}

function getApproveLabel(roleId) {
  return {
    reception: 'Délivrer le récépissé',
    instruction: 'Valider l\'instruction',
    tax: 'Émettre avis fiscal favorable',
    customs: 'Émettre avis douanier favorable',
    chef_gu: 'Transmettre au DG pour signature',
    dg: '✓ Signer la convention'
  }[roleId] || 'Approuver';
}

function getCommentPlaceholder(roleId) {
  return {
    reception: 'Notes de réception (complétude du dossier)…',
    instruction: 'Synthèse de l\'instruction technique…',
    tax: 'Position de l\'administration fiscale (motivation)…',
    customs: 'Position de l\'administration douanière (motivation)…',
    chef_gu: 'Synthèse pour la signature du DG…',
    dg: 'Note de signature (facultatif)…'
  }[roleId] || '';
}

function getArticleRef(roleId) {
  return {
    reception: '30.3',
    instruction: '6, 7, 8',
    tax: '30.5',
    customs: '30.5, 33',
    chef_gu: '30.4',
    dg: '30.4, 31'
  }[roleId] || '—';
}

function getCredit(d) {
  const cat = categoryFor(d.amount);
  const base = { A: 25, B: 50, C: 75 }[cat];
  const zdp  = { A: 30, B: 55, C: 80 }[cat];
  return d.isZdp ? zdp : base;
}

document.addEventListener('click', (e) => {
  // === LOGIN SCREEN ACTIONS ===
  const langFr = e.target.closest('#langFr');
  if (langFr) { state.language = 'fr'; render(); return; }
  const langEn = e.target.closest('#langEn');
  if (langEn) { state.language = 'en'; render(); return; }
  const lt = e.target.closest('[data-login-tab]');
  if (lt) { state.loginTab = lt.dataset.loginTab; render(); return; }
  const ls = e.target.closest('[data-action="login-staff"]');
  if (ls) { handleLoginStaff(); return; }
  const li = e.target.closest('[data-action="login-investor"]');
  if (li) { handleLoginInvestor(); return; }
  const qs = e.target.closest('[data-quick-staff]');
  if (qs) { loginAsStaff(qs.dataset.quickStaff); return; }
  const qi = e.target.closest('[data-quick-investor]');
  if (qi) { loginAsInvestor(qi.dataset.quickInvestor); return; }

  // === HEADER ACTIONS ===
  if (e.target.closest('#langToggle')) {
    state.language = state.language === 'fr' ? 'en' : 'fr';
    render(); return;
  }
  if (e.target.closest('#notifBell')) {
    state.notificationsOpen = !state.notificationsOpen;
    render(); return;
  }
  if (e.target.closest('#markAllRead')) {
    state.notifications.forEach(n => { if (n.forUser === state.currentUser.id) n.read = true; });
    render(); return;
  }
  const notifClick = e.target.closest('.notif[data-notif-id]');
  if (notifClick) {
    const id = notifClick.dataset.notifId;
    const n = state.notifications.find(x => x.id === id);
    if (n) { n.read = true; }
    const dId = notifClick.dataset.dossierId;
    if (dId) {
      state.selectedDossierId = dId;
      state.screen = isInvestor() ? 'my_dossier' : 'dossier';
    }
    state.notificationsOpen = false;
    render();
    return;
  }
  // close notif panel on outside click
  if (state.notificationsOpen && !e.target.closest('#notifPanel') && !e.target.closest('#notifBell')) {
    state.notificationsOpen = false;
    render();
    return;
  }

  // dismiss banner
  if (e.target.dataset.action === 'dismiss-banner') {
    state.bannerDismissed = true;
    render();
    return;
  }

  // user switcher toggle
  const swEl = document.getElementById('userSwitcher');
  if (swEl.contains(e.target) && !e.target.closest('.menu')) {
    swEl.classList.toggle('open');
    return;
  } else if (!swEl.contains(e.target)) {
    swEl.classList.remove('open');
  }

  // role switch (staff)
  const roleItem = e.target.closest('.role-item[data-role]');
  if (roleItem) {
    loginAsStaff(roleItem.dataset.role);
    swEl.classList.remove('open');
    return;
  }
  // investor switch
  const invItem = e.target.closest('.role-item[data-investor]');
  if (invItem) {
    loginAsInvestor(invItem.dataset.investor);
    swEl.classList.remove('open');
    return;
  }

  // logout
  if (e.target.closest('[data-action="logout"]')) {
    handleLogout();
    swEl.classList.remove('open');
    return;
  }

  // reset
  if (e.target.closest('[data-action="reset"]')) {
    if (confirm(state.language === 'fr' ? 'Réinitialiser toutes les données de démonstration ?' : 'Reset all demo data?')) {
      resetState();
    }
    swEl.classList.remove('open');
    return;
  }

  // switch-role action button
  const switchRole = e.target.closest('[data-action="switch-role"]');
  if (switchRole) {
    loginAsStaff(switchRole.dataset.role);
    state.screen = 'dossier';
    render();
    return;
  }

  // doc preview
  const dp = e.target.closest('[data-action="preview-doc"]');
  if (dp) {
    state.docPreview = { dossierId: dp.dataset.id, kind: dp.dataset.kind };
    render();
    return;
  }
  if (e.target.closest('[data-action="close-doc-preview"]') ||
      (e.target.id === 'docPreviewOverlay')) {
    state.docPreview = null;
    render();
    return;
  }
  const accD = e.target.closest('[data-action="accept-doc"]');
  if (accD) {
    handleAcceptDoc(accD.dataset.id, accD.dataset.kind);
    return;
  }
  const rejD = e.target.closest('[data-action="reject-doc"]');
  if (rejD) {
    handleRejectDoc(rejD.dataset.id, rejD.dataset.kind);
    return;
  }
  const upD = e.target.closest('[data-action="upload-doc"]');
  if (upD) {
    handleUploadDoc(upD.dataset.id, upD.dataset.kind);
    return;
  }
  const subD = e.target.closest('[data-action="submit-investor-dossier"]');
  if (subD) {
    handleSubmitInvestorDossier(subD.dataset.id);
    return;
  }
  const openMsg = e.target.closest('[data-action="open-message"]');
  if (openMsg) {
    const id = openMsg.dataset.id;
    const n = state.notifications.find(x => x.id === id);
    if (n) n.read = true;
    render();
    return;
  }

  // screen navigation
  const navEl = e.target.closest('[data-screen]');
  if (navEl) {
    state.screen = navEl.dataset.screen;
    if (state.screen !== 'dossier' && state.screen !== 'acte') {
      state.selectedDossierId = null;
    }
    state.selectedTab = 'timeline';
    render();
    return;
  }

  // open dossier
  const openD = e.target.closest('[data-action="open-dossier"]');
  if (openD) {
    state.selectedDossierId = openD.dataset.id;
    state.screen = 'dossier';
    state.selectedTab = 'timeline';
    render();
    return;
  }

  // view acte
  const viewActe = e.target.closest('[data-action="view-acte"]');
  if (viewActe) {
    state.selectedDossierId = viewActe.dataset.id;
    state.screen = 'acte';
    render();
    return;
  }

  // tab switch
  const tab = e.target.closest('.tab[data-tab]');
  if (tab) {
    state.selectedTab = tab.dataset.tab;
    render();
    return;
  }

  // approve & forward
  const approve = e.target.closest('[data-action="approve-forward"]');
  if (approve) {
    handleApprove(approve.dataset.id);
    return;
  }

  // return
  const ret = e.target.closest('[data-action="return-dossier"]');
  if (ret) {
    handleReturn(ret.dataset.id);
    return;
  }

  // reject
  const rej = e.target.closest('[data-action="reject-dossier"]');
  if (rej) {
    handleReject(rej.dataset.id);
    return;
  }
});

  loginAsInvestor((matched && matched.id) || 'inv_tchoua');
}
function loginAsStaff(roleId) {
  const r = ROLES.find(x => x.id === roleId) || ROLES[0];
  state.authenticated = true;
  state.currentUser = { type: 'staff', id: r.id, name: r.name, title: r.title, titleEn: r.titleEn, initials: r.initials, stageIndex: r.stageIndex };
  state.currentRole = r.id;
  state.screen = 'dashboard';
  state.selectedDossierId = null;
  state.notificationsOpen = false;
  render();
}
function loginAsInvestor(invId) {
  const inv = INVESTORS.find(x => x.id === invId) || INVESTORS[0];
  state.authenticated = true;
  state.currentUser = {
    type: 'investor',
    id: inv.id, name: inv.name,
    title: state.language === 'fr' ? 'Investisseur · ' + inv.company : 'Investor · ' + inv.company,
    initials: inv.initials, email: inv.email, company: inv.company, dossierId: inv.dossierId
  };
  state.screen = 'my_dossier';
  state.selectedDossierId = null;
  state.notificationsOpen = false;
  render();
}
function handleLogout() {
  // Tour mode: "logout" just resets to the default identity (no login screen)
  const defaultStaff = ROLES.find(r => r.id === 'reception');
  state.authenticated = true;
  state.currentUser = {
    type: 'staff',
    id: defaultStaff.id,
    name: defaultStaff.name,
    title: defaultStaff.title,
    titleEn: defaultStaff.titleEn,
    initials: defaultStaff.initials,
    stageIndex: defaultStaff.stageIndex,
  };
  state.currentRole = defaultStaff.id;
  state.screen = 'dashboard';
  state.selectedDossierId = null;
  state.notificationsOpen = false;
  state.docPreview = null;
  render();
}

// === Doc verification / upload handlers ===

function handleAcceptDoc(dossierId, kind) {
  const d = state.dossiers.find(x => x.id === dossierId);
  if (!d) return;
  const doc = d.documents.find(x => x.kind === kind);
  if (!doc) return;
  const u = currentUser();
  doc.verification = 'accepted';
  doc.verifiedBy = u.name;
  doc.verifiedAt = todayISO();
  delete doc.rejectionReason;
  // Notify investor
  state.notifications.push({
    id: 'n_' + Date.now() + '_' + kind,
    forUser: d.investorId, forType: 'investor',
    icon: '✓', iconCls: 'green',
    title: (state.language === 'fr' ? 'Pièce acceptée : ' : 'Document accepted: ') + (REQUIRED_DOCS.find(r => r.kind === kind)?.name || doc.name),
    dossierId: d.id,
    at: new Date().toISOString(), read: false
  });
  saveState();
  render();
}

function handleRejectDoc(dossierId, kind) {
  const reason = prompt(state.language === 'fr' ? 'Motif du rejet (visible par l\'investisseur) :' : 'Rejection reason (visible to the investor):');
  if (!reason || !reason.trim()) return;
  const d = state.dossiers.find(x => x.id === dossierId);
  if (!d) return;
  const doc = d.documents.find(x => x.kind === kind);
  if (!doc) return;
  const u = currentUser();
  doc.verification = 'rejected';
  doc.verifiedBy = u.name;
  doc.verifiedAt = todayISO();
  doc.rejectionReason = reason.trim();
  state.notifications.push({
    id: 'n_' + Date.now() + '_' + kind,
    forUser: d.investorId, forType: 'investor',
    icon: '✕', iconCls: 'red',
    title: (state.language === 'fr' ? 'Pièce rejetée : ' : 'Document rejected: ') + (REQUIRED_DOCS.find(r => r.kind === kind)?.name || doc.name) + ' — ' + reason.trim().slice(0, 80),
    dossierId: d.id,
    at: new Date().toISOString(), read: false
  });
  saveState();
  render();
}

function handleUploadDoc(dossierId, kind) {
  const d = state.dossiers.find(x => x.id === dossierId);
  if (!d) return;
  const reqDef = REQUIRED_DOCS.find(r => r.kind === kind);
  if (!reqDef) return;
  // Simulate file upload by setting a placeholder
  const existing = d.documents.find(x => x.kind === kind);
  if (existing) {
    existing.uploaded = todayISO();
    existing.verification = 'pending';
    delete existing.verifiedBy;
    delete existing.verifiedAt;
    delete existing.rejectionReason;
  } else {
    d.documents.push({
      kind, name: reqDef.name + ' — scan_' + dossierId.replace('/','_') + '.pdf',
      uploaded: todayISO(),
      verification: 'pending'
    });
  }
  saveState();
  render();
}

function handleSubmitInvestorDossier(dossierId) {
  const d = state.dossiers.find(x => x.id === dossierId);
  if (!d) return;
  const allUploaded = REQUIRED_DOCS.every(rd => d.documents.find(doc => doc.kind === rd.kind));
  if (!allUploaded) {
    alert(state.language === 'fr' ? 'Toutes les 6 pièces obligatoires doivent être téléversées.' : 'All 6 mandatory documents must be uploaded.');
    return;
  }
  d.state = 'SUBMITTED';
  d.submittedAt = todayISO();
  d.history.push({
    actor: 'investor', role: state.language === 'fr' ? 'Investisseur' : 'Investor',
    action: state.language === 'fr' ? 'Dossier soumis en ligne (vérification des pièces en cours)' : 'Application submitted online (document verification pending)',
    at: new Date().toISOString(), class: ''
  });
  // Notify reception
  state.notifications.push({
    id: 'n_' + Date.now(),
    forUser: 'reception', forType: 'staff',
    icon: '📥', iconCls: 'amber',
    title: (state.language === 'fr' ? 'Nouveau dossier soumis : ' : 'New dossier submitted: ') + d.id + ' · ' + d.investor.raisonSociale,
    dossierId: d.id,
    at: new Date().toISOString(), read: false
  });
  saveState();
  state.screen = 'my_dossier';
  render();
}

// === Existing action handlers ===

function handleApprove(dossierId) {
  const d = state.dossiers.find(x => x.id === dossierId);
  const u = currentUser();
  if (!d || STATE_TO_ROLE[d.state] !== u.id) return;

  // Block Reception receipt issuance if any document is not accepted
  if (u.id === 'reception' && d.state === 'SUBMITTED') {
    const allAccepted = d.documents.length > 0 && d.documents.every(x => x.verification === 'accepted');
    if (!allAccepted) {
      alert(state.language === 'fr'
        ? 'Le récépissé ne peut être délivré que lorsque toutes les pièces sont acceptées. Allez à l\'onglet « Documents » pour vérifier chaque pièce.'
        : 'The receipt can only be issued once every document is accepted. Go to the "Documents" tab to verify each item.');
      return;
    }
  }

  const comment = document.getElementById('actionComment')?.value || '';
  const position = document.getElementById('opinionPosition')?.value || 'favorable';
  const recepNo = document.getElementById('recepNo')?.value;
  const agreementNo = document.getElementById('agreementNo')?.value;

  const now = new Date().toISOString();

  // Défavorable branching: tax/customs unfavorable routes back to Chef GU for decision (skips remaining linear advance)
  if ((u.id === 'tax' || u.id === 'customs') && position === 'unfavorable') {
    d.avis.push({ admin: u.id, position, signedBy: u.name, signedAt: todayISO(), text: comment || '(Avis défavorable)' });
    d.history.push({
      actor: u.id,
      role: `${u.name} (${STAGES.find(s => s.role === u.id).long})`,
      action: (u.id === 'tax' ? 'Avis fiscal DÉFAVORABLE émis' : 'Avis douanier DÉFAVORABLE émis') + ' — renvoi en synthèse',
      comment: comment || undefined,
      at: now,
      class: 'return'
    });
    d.state = 'CUSTOMS_OPINION_DONE'; // routes to Chef GU
    d.hasUnfavorable = true;
    // Notify Chef GU
    state.notifications.push({
      id: 'n_' + Date.now(),
      forUser: 'chef_gu', forType: 'staff',
      icon: '⚠', iconCls: 'red',
      title: (state.language === 'fr' ? 'Avis défavorable sur dossier ' : 'Unfavourable opinion on dossier ') + d.id + ' — ' + (state.language === 'fr' ? 'arbitrage requis' : 'arbitration required'),
      dossierId: d.id,
      at: new Date().toISOString(), read: false
    });
    saveState();
    render();
    return;
  }

  // record history
  const historyMap = {
    reception: `Récépissé de dépôt délivré${recepNo ? ' (n° ' + recepNo + ')' : ''}`,
    instruction: 'Instruction technique terminée — avis ' + positionLabel(position),
    tax: 'Avis fiscal ' + positionLabel(position) + ' émis',
    customs: 'Avis douanier ' + positionLabel(position) + ' émis',
    chef_gu: 'Synthèse validée, transmission au DG pour signature',
    dg: 'Convention signée — agrément délivré' + (agreementNo ? ' (n° ' + agreementNo + ')' : '')
  };

  d.history.push({
    actor: u.id,
    role: `${u.name} (${STAGES.find(s => s.role === u.id).long})`,
    action: historyMap[u.id],
    comment: comment || undefined,
    at: now,
    class: ''
  });

  // updates
  if (u.id === 'reception') {
    d.recepisseAt = todayISO();
    d.recepisseNo = recepNo;
  }
  if (u.id === 'instruction') {
    d.avis.push({ admin: 'instruction', position, signedBy: u.name, signedAt: todayISO(), text: comment || '(Avis émis)' });
  }
  if (u.id === 'tax') {
    d.avis.push({ admin: 'tax', position, signedBy: u.name, signedAt: todayISO(), text: comment || '(Avis émis)' });
  }
  if (u.id === 'customs') {
    d.avis.push({ admin: 'customs', position, signedBy: u.name, signedAt: todayISO(), text: comment || '(Avis émis)' });
  }
  if (u.id === 'dg') {
    d.agreementNo = agreementNo;
    state.counter++;
  }

  // advance state
  d.state = NEXT_STATE[d.state];

  // notify next-stage owner + investor
  const nextOwner = STATE_TO_ROLE[d.state];
  if (nextOwner) {
    state.notifications.push({
      id: 'n_' + Date.now() + '_n',
      forUser: nextOwner, forType: 'staff',
      icon: '📋', iconCls: 'blue',
      title: (state.language === 'fr' ? 'Dossier transféré : ' : 'Dossier handed over: ') + d.id + ' · ' + d.investor.raisonSociale,
      dossierId: d.id,
      at: new Date().toISOString(), read: false
    });
  }
  if (d.investorId) {
    state.notifications.push({
      id: 'n_' + Date.now() + '_i',
      forUser: d.investorId, forType: 'investor',
      icon: d.state === 'ACCREDITED' ? '🎉' : '📋', iconCls: d.state === 'ACCREDITED' ? 'green' : 'blue',
      title: d.state === 'ACCREDITED'
        ? (state.language === 'fr' ? '🎉 Convention d\'investissement signée — votre acte d\'agrément est disponible' : '🎉 Investment Convention signed — your decree is available')
        : (state.language === 'fr' ? `Votre dossier ${d.id} a progressé : ${STATE_TITLES[d.state]}` : `Your dossier ${d.id} has advanced: ${STATE_TITLES[d.state]}`),
      dossierId: d.id,
      at: new Date().toISOString(), read: false
    });
  }

  saveState();
  render();
}

function positionLabel(p) {
  return { favorable: 'favorable', favorable_reserve: 'favorable avec réserves', unfavorable: 'défavorable' }[p] || p;
}

function handleReturn(dossierId) {
  const d = state.dossiers.find(x => x.id === dossierId);
  const u = currentUser();
  if (!d) return;
  const comment = document.getElementById('actionComment')?.value || '';
  if (!comment.trim()) {
    showModal({
      title: 'Motivation requise',
      body: 'Veuillez indiquer la raison du retour pour complément dans le champ « Commentaire / motivation ».',
      actions: [{ label: 'OK', class: 'primary' }]
    });
    return;
  }
  d.state = 'RETURNED';
  d.history.push({
    actor: u.id,
    role: `${u.name} (${STAGES.find(s => s.role === u.id).long})`,
    action: 'Dossier retourné à l\'investisseur pour complément',
    comment,
    at: new Date().toISOString(),
    class: 'return'
  });
  saveState();
  render();
}

function handleReject(dossierId) {
  const d = state.dossiers.find(x => x.id === dossierId);
  const u = currentUser();
  if (!d) return;
  const comment = document.getElementById('actionComment')?.value || '';
  if (!comment.trim()) {
    showModal({
      title: 'Motivation requise',
      body: 'Le rejet doit être motivé. Veuillez préciser la raison dans le champ « Commentaire / motivation ».',
      actions: [{ label: 'OK', class: 'primary' }]
    });
    return;
  }
  showModal({
    title: 'Confirmer le rejet',
    body: `Vous êtes sur le point de rejeter définitivement le dossier ${d.id} (${d.investor.raisonSociale}). Cette action est irréversible dans la démo.`,
    actions: [
      { label: 'Annuler', class: 'ghost' },
      { label: 'Confirmer le rejet', class: 'danger', onClick: () => {
        d.state = 'REJECTED';
        d.history.push({
          actor: u.id,
          role: `${u.name} (${STAGES.find(s => s.role === u.id).long})`,
          action: 'Dossier rejeté',
          comment,
          at: new Date().toISOString(),
          class: 'reject'
        });
        saveState();
        render();
      }}
    ]
  });
}

// === Form submit ===

document.addEventListener('submit', (e) => {
  if (e.target.id === 'newDossierForm') {
    e.preventDefault();
    const f = e.target;
    const fd = new FormData(f);
    const amount = parseInt(fd.get('amount'), 10);
    if (!amount || amount < 1) {
      alert('Montant invalide.');
      return;
    }
    const docKindMap = {
      doc_activity: { kind: 'activity_authorization', name: 'Autorisation d\'exercice' },
      doc_recruitment: { kind: 'recruitment_plan', name: 'Plan de recrutement Camerounais' },
      doc_tech: { kind: 'tech_transfer_plan', name: 'Plan de transfert de technologies' },
      doc_subcontract: { kind: 'local_subcontracting', name: 'Plan de sous-traitance locale' },
      doc_financing: { kind: 'financing_proof', name: 'Justification du financement' },
      doc_feasibility: { kind: 'feasibility', name: 'Étude de faisabilité' }
    };
    const docs = [];
    Object.entries(docKindMap).forEach(([k, v]) => {
      if (fd.get(k)) docs.push({ kind: v.kind, name: v.name, uploaded: todayISO() });
    });
    const art7 = ['art7_jobs','art7_local_inputs','art7_cm_products','art7_value_added','art7_exports'].filter(k => fd.get(k));

    const newDossier = {
      id: '2025/' + String(state.counter).padStart(6, '0'),
      investor: {
        raisonSociale: fd.get('raisonSociale'),
        niu: fd.get('niu'),
        legalForm: fd.get('legalForm'),
        country: fd.get('country'),
        contact: { name: fd.get('contactName'), email: fd.get('contactEmail'), phone: '' }
      },
      sector: fd.get('sector'),
      type: fd.get('type'),
      amount,
      isZdp: !!fd.get('isZdp'),
      zdpLocality: fd.get('zdpLocality') || null,
      objet: fd.get('objet'),
      installationMonths: parseInt(fd.get('installationMonths'), 10) || 24,
      eligibility: { art7, criteriaDetails: 'Critères déclarés à la soumission.' },
      state: 'SUBMITTED',
      submittedAt: todayISO(),
      recepisseAt: null,
      documents: docs,
      avis: [],
      history: [
        { actor: 'investor', role: 'Investisseur', action: 'Dossier soumis via le portail', at: new Date().toISOString(), class: '' }
      ]
    };
    state.dossiers.push(newDossier);
    state.counter++;
    state.selectedDossierId = newDossier.id;
    state.screen = 'dossier';
    state.selectedTab = 'timeline';
    saveState();
    render();
    setTimeout(() => {
      showModal({
        title: 'Dossier créé',
        body: `Le dossier ${newDossier.id} a été enregistré et soumis. Il apparaît désormais dans la corbeille de la Réception (étape 1/6).`,
        actions: [{ label: 'OK', class: 'primary' }]
      });
    }, 100);
  }
});

// === Modal ===

function showModal({ title, body, actions }) {
  const ov = document.getElementById('modalOverlay');
  const mc = document.getElementById('modalContent');
  mc.innerHTML = `
    <h2>${title}</h2>
    <p>${body}</p>
    <div class="modal-actions"></div>
  `;
  const actBox = mc.querySelector('.modal-actions');
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn ' + (a.class || '');
    b.textContent = a.label;
    b.addEventListener('click', () => {
      ov.classList.remove('open');
      if (a.onClick) a.onClick();
    });
    actBox.appendChild(b);
  });
  ov.classList.add('open');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') {
    document.getElementById('modalOverlay').classList.remove('open');
  }
});

// === Boot ===

render();
</script>
